<prayer-card{{#if prayerId}} data-prayer-id="{{prayerId}}"{{/if}}>
    <div>
        {{#if badge}}<span class="badge inter">{{badge}}</span>{{/if}}
        {{#if showFavorite}}
            <label class="favorite">
                <input class="visually-hidden" type="checkbox" aria-label="Přidat mezi oblíbené" />
                {{> icons/icon-heart}}
            </label>
        {{/if}}
    </div>
    <h3><a href="{{href}}">{{title}}</a></h3>  <!-- stretched link -->
    {{#if description}}<p class="description inter">{{description}}</p>{{/if}}
</prayer-card>
